services:
  mysqldb:
    image: mysql:latest
    restart: unless-stopped
    env_file: ${ENV_FILE:-./.env}
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQLDB_ROOT_PASSWORD
      - MYSQL_DATABASE=$MYSQLDB_DATABASE
      - TZ=Europe/Warsaw
    volumes:
      - db:/var/lib/mysql
      - ./db-dump:/db-dump
    networks:
      - backend
    command: --secure-file-priv="/db-dump/"
      --default-time-zone=+02:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin status -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    hostname: mysqldb

  api:
    depends_on:
      migrations:
        condition: service_completed_successfully
    image: pawel2923/airtrans-api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-./.env}
    ports:
      - $API_PUBLISHED_PORT:$API_INTERNAL_PORT
    environment:
      - DB_HOST=mysqldb
      - DB_ADMIN_PASSWORD=$MYSQLDB_ADMIN_PASSWORD
      - DB_CLIENT_PASSWORD=$MYSQLDB_CLIENT_PASSWORD
      - DB_ATC_PASSWORD=$MYSQLDB_ATC_PASSWORD
      - DB_GROUND_CREW_PASSWORD=$MYSQLDB_GROUND_CREW_PASSWORD
      - DB_AIRPORT_STAFF_PASSWORD=$MYSQLDB_AIRPORT_STAFF_PASSWORD
      - DB_PARKING_STAFF_PASSWORD=$MYSQLDB_PARKING_STAFF_PASSWORD
      - DB_RENTAL_STAFF_PASSWORD=$MYSQLDB_RENTAL_STAFF_PASSWORD
      - DB_NAME=$MYSQLDB_DATABASE
      - DB_PORT=$MYSQLDB_INTERNAL_PORT
      - UI_ORIGIN=$UI_ORIGIN
    volumes:
      - ./api/files:/api/files
      - ${SSL_CERT_PATH:-/etc/ssl/certs/cloudflare-origin.pem}:/api/ssl/fullchain.pem:ro
      - ${SSL_KEY_PATH:-/etc/ssl/private/cloudflare-origin.key}:/api/ssl/privkey.key:ro
    networks:
      - backend
      - frontend
  migrations:
    depends_on:
      mysqldb:
        condition: service_healthy
    image: pawel2923/airtrans-api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: "no"
    env_file: ${ENV_FILE:-./.env}
    environment:
      - DB_HOST=mysqldb
      - DB_MIGRATION_USER=${DB_MIGRATION_USER:-root}
      - DB_MIGRATION_PASSWORD=${DB_MIGRATION_PASSWORD:-$MYSQLDB_ROOT_PASSWORD}
      - DB_NAME=${DB_NAME:-$MYSQLDB_DATABASE}
      - DB_PORT=${DB_PORT:-$MYSQLDB_INTERNAL_PORT}
    command: ["npm", "run", "db:setup"]
    networks:
      - backend

  ui:
    image: pawel2923/airtrans-ui:latest
    build:
      context: ./ui
      dockerfile: Dockerfile.prod
      args:
        - VITE_MODE=production
        - VITE_API_ORIGIN=$API_ORIGIN
    depends_on:
      - api
    volumes:
      - ./ui/src:/ui/src
      - ./ui/public:/ui/public
      - ./ui/index.html:/ui/index.html
      - ${SSL_CERT_PATH:-/etc/ssl/certs/cloudflare-origin.pem}:/etc/nginx/ssl/fullchain.pem:ro
      - ${SSL_KEY_PATH:-/etc/ssl/private/cloudflare-origin.key}:/etc/nginx/ssl/privkey.key:ro
    environment:
      - TZ=Europe/Warsaw
      - UI_PROTOCOL=$UI_PROTOCOL
      - UI_SERVER_HOST=$UI_SERVER_HOST
      - UI_INTERNAL_PORT=$UI_INTERNAL_PORT
      - VITE_API_ORIGIN=$API_ORIGIN
    ports:
      - $UI_PUBLISHED_PORT:$UI_INTERNAL_PORT
    networks:
      - frontend

volumes:
  db:

networks:
  backend:
  frontend:
