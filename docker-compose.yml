services:
  mysqldb:
    image: mysql:latest
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQLDB_ROOT_PASSWORD
      - MYSQL_DATABASE=$MYSQLDB_DATABASE
      - TZ=Europe/Warsaw
    ports:
      - $MYSQLDB_PUBLISHED_PORT:$MYSQLDB_INTERNAL_PORT
    volumes:
      - db:/var/lib/mysql
      - ./db-dump:/db-dump
    networks:
      - backend
    command: 
      --secure-file-priv="/db-dump/"
      --default-time-zone=+02:00
    hostname: mysqldb
  api:
    depends_on:
      - mysqldb
    build: ./api
    restart: unless-stopped
    env_file: ./.env
    ports:
      - $API_PUBLISHED_PORT:$API_INTERNAL_PORT
    environment:
      - DB_HOST=mysqldb
      - DB_ADMIN_PASSWORD=$MYSQLDB_ADMIN_PASSWORD
      - DB_CLIENT_PASSWORD=$MYSQLDB_CLIENT_PASSWORD
      - DB_ATC_PASSWORD=$MYSQLDB_ATC_PASSWORD
      - DB_GROUND_CREW_PASSWORD=$MYSQLDB_GROUND_CREW_PASSWORD
      - DB_AIRPORT_STAFF_PASSWORD=$MYSQLDB_AIRPORT_STAFF_PASSWORD
      - DB_PARKING_STAFF_PASSWORD=$MYSQLDB_PARKING_STAFF_PASSWORD
      - DB_RENTAL_STAFF_PASSWORD=$MYSQLDB_RENTAL_STAFF_PASSWORD
      - DB_NAME=$MYSQLDB_DATABASE
      - DB_PORT=$MYSQLDB_INTERNAL_PORT
      - UI_ORIGIN=$UI_ORIGIN
    volumes:
      - ./api/files:/api/files
    networks:
      - backend
      - frontend
  ui:
    depends_on:
      - api
    volumes:
      - ./ui/:/ui/
      - /ui/node_modules
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
      args:
        - VITE_MODE=development
        - VITE_API_ORIGIN=$API_ORIGIN
    restart: unless-stopped
    environment:
      - TZ=Europe/Warsaw
      - UI_INTERNAL_PORT=$UI_INTERNAL_PORT
      - UI_PUBLISHED_PORT=$UI_PUBLISHED_PORT
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_ORIGIN=$API_ORIGIN
    ports:
      - $UI_PUBLISHED_PORT:5173
    networks:
      - frontend
    stdin_open: true
    tty: true

volumes:
  db:

networks:
  backend:
  frontend:
